name: Terraform Module Checks

on:
  workflow_call:
    inputs:
      concurrency_group:
        description: "Name of concurrency group to manage concurrent github action runs"
        default: ${{ github.repository }}/${{ github.event.pull_request.head.ref || github.ref }}
        required: false
        type: string
      runner_type:
        description: "Type of runner (GitHub-hosted or self-hosted)"
        required: false
        default: "ubuntu-latest"
        type: string
      commit_user:
        description: "Username which should be used for commits by github action"
        default: "github-actions"
        required: false
        type: string
      commit_email:
        description: "Email which should be used for commits by github action"
        default: "noreply@github.com"
        required: false
        type: string

      gh_wf_repo_ref:
        description: "Ref or branch of this gh_wf_repo"
        default: "main"
        required: false
        type: string
      
        # GitHub Workflow config repo details
      gh_wf_config_repo:
        description: "Public repo where GitHub workflow config is stored"
        default: "acai-consulting/github-workflow-configs"
        required: false
        type: string
      gh_wf_config_repo_ref:
        description: "Ref or branch of gh_wf_config_repo"
        default: "main"
        required: false
        type: string

      linting_include:
        description: "Whether to include Python or TFLint code quality checks"
        required: false
        default: true
        type: boolean
      linting_allow_failures:
        description: "Whether to allow Python linting failures to pass the pipeline"
        required: false
        default: false
        type: boolean

      tf_version:
        description: "Terraform version used for formatting and docs"
        default: "latest"
        required: false
        type: string        
      tf_lint_config_path:
        description: 'Path to tflint config in gh_wf_config_repo (e.g. "aws/.tflint.hcl")'
        default: ".tflint.hcl"
        required: false
        type: string
      tf_lint_version:
        description: "Tflint version to use"
        default: "latest"
        required: false
        type: string
      tf_trivy_version:
        description: "Trivy version to use"
        default: "latest"
        required: false
        type: string
      tf_checkov_failures_allow:
        description: "Whether to abort the workflow if Checkov checks fail"
        required: false
        default: false
        type: boolean

      python_version:
        description: "Python version"
        default: "3.11"
        required: false
        type: string
      python_lint_config_path:
        description: 'Path to python config in python_config_repo (e.g. "python")'
        default: "python"
        required: false
        type: string

    outputs:
      all_steps_passed:
        description: "Indicates if all pipeline steps passed successfully"
        value: ${{ jobs.terraform_base.outputs.all_steps_passed == 'true' && jobs.python_base.outputs.all_steps_passed == 'true' && jobs.terraform_security.outputs.security_checks_passed == 'true' }}
      terraform_base_status:
        description: "Terraform base pipeline status"
        value: ${{ jobs.terraform_base.outputs.all_steps_passed }}
      terraform_security_status:
        description: "Security checks status"
        value: ${{ jobs.terraform_security.outputs.security_checks_passed }}
      python_base_status:
        description: "Python base pipeline status"
        value: ${{ jobs.python_base.outputs.all_steps_passed }}

# Ensures that only one workflow runs at a time
concurrency: 
  group: ${{ inputs.concurrency_group }}
  cancel-in-progress: true

jobs:
  # Call Terraform Base workflow (format & docs)
  terraform_base:
    uses: acai-solutions/github-workflows/.github/workflows/tf-base.yml@main
    with:
      concurrency_group: ${{ inputs.concurrency_group }}
      runner_type: ${{ inputs.runner_type }}
      commit_user: ${{ inputs.commit_user }}
      commit_email: ${{ inputs.commit_email }}
      tf_version: ${{ inputs.tf_version }}
    secrets: inherit

  # Call Security workflow
  terraform_security:
    needs:
      - terraform_base
    if: ${{ always() && needs.terraform_base.result == 'success' }}
    uses: acai-solutions/github-workflows/.github/workflows/tf-security.yml@main
    with:
      concurrency_group: ${{ inputs.concurrency_group }}
      runner_type: ${{ inputs.runner_type }}
      gh_wf_config_repo: ${{ inputs.gh_wf_config_repo }}
      gh_wf_config_repo_ref: ${{ inputs.gh_wf_config_repo_ref }}
      linting_include: ${{ inputs.linting_include }}
      linting_allow_failures: ${{ inputs.linting_allow_failures }}
      tf_lint_config_path: ${{ inputs.tf_lint_config_path }}
      tf_lint_version: ${{ inputs.tf_lint_version }}
      trivy_version: ${{ inputs.tf_trivy_version }}
      checkov_failures_allow: ${{ inputs.tf_checkov_failures_allow }}
    secrets: inherit

  # Call Python Base workflow (if Python files exist)
  python_base:
    uses: acai-solutions/github-workflows/.github/workflows/python-base.yml@main
    with:
      concurrency_group: ${{ inputs.concurrency_group }}
      runner_type: ${{ inputs.runner_type }}
      commit_user: ${{ inputs.commit_user }}
      commit_email: ${{ inputs.commit_email }}
      gh_wf_config_repo: ${{ inputs.gh_wf_config_repo }}
      gh_wf_config_repo_ref: ${{ inputs.gh_wf_config_repo_ref }}
      linting_include: ${{ inputs.linting_include }}
      linting_allow_failures: true # ${{ inputs.linting_allow_failures }}
      python_version: ${{ inputs.python_version }}
      python_config_path: ${{ inputs.python_lint_config_path }}
    secrets: inherit

  # Final summary
  tf_module_checks_summary:
    needs:
      - terraform_base
      - terraform_security
      - python_base
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Overall Summary
        run: |
          echo '# 📊 Terraform Module Checks - Overall Summary' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '## Pipeline Results' >> $GITHUB_STEP_SUMMARY
          echo '| Component | Status |' >> $GITHUB_STEP_SUMMARY
          echo '|-----------|--------|' >> $GITHUB_STEP_SUMMARY
          
          echo "| 📝 Terraform Base (Format & Docs) | ${{ needs.terraform_base.outputs.all_steps_passed == 'true' && '✅ Passed' || needs.terraform_base.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐍 Python Base (Quality & Tests) | ${{ needs.python_base.outputs.all_steps_passed == 'true' && '✅ Passed' || needs.python_base.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security Checks | ${{ needs.terraform_security.outputs.tf_security_checks_passed == 'true' && '✅ Passed' || needs.terraform_security.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          
          # Check if all enabled components passed
          TF_BASE_PASSED="${{ needs.terraform_base.outputs.all_steps_passed == 'true' }}"
          PYTHON_BASE_PASSED="${{ needs.python_base.outputs.all_steps_passed == 'true' }}"
          SECURITY_PASSED="${{ needs.terraform_security.outputs.tf_security_checks_passed == 'true' }}"
          
          if [[ "$TF_BASE_PASSED" == "true" && "$PYTHON_BASE_PASSED" == "true" && "$SECURITY_PASSED" == "true" ]]; then
            echo "**🎉 Overall Result: ✅ All checks passed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**⚠️ Overall Result: ❌ Some checks failed. Please review the detailed results above.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed Components:" >> $GITHUB_STEP_SUMMARY
            
            if [[ "$TF_BASE_PASSED" != "true" ]]; then
              echo "- Terraform Base (Format & Docs)" >> $GITHUB_STEP_SUMMARY
            fi
            if [[ "$PYTHON_BASE_PASSED" != "true" ]]; then
              echo "- Python Base (Quality & Tests)" >> $GITHUB_STEP_SUMMARY
            fi
            if [[ "$SECURITY_PASSED" != "true" ]]; then
              echo "- Security Checks" >> $GITHUB_STEP_SUMMARY
            fi
          fi
      
      - name: Check Overall Status
        if: always()
        run: |
          if [[ "${{ needs.terraform_base.outputs.all_steps_passed }}" != "true" ]] || \
             [[ "${{ needs.python_base.outputs.all_steps_passed }}" != "true" ]] || \
             [[ "${{ needs.terraform_security.outputs.tf_security_checks_passed }}" != "true" ]]; then
            echo "::error::Some checks failed. See summary above for details."
            exit 1
          fi
